<style id="appcss">
/* Layout: one-column phone app; a departure-board band for the countdown, port guide below, tab bar pinned to the bottom. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#000000; --muted:#3A4654; --line:#C3D3E6;
  --sea:#0A56C2; --sea-soft:#E8F1FC; --sun:#1565D8; --sun-ink:#0A3F91;
  --board:#0B3D91; --board-ink:#FFFFFF; --board-dim:#CFE0F7;
  --cell:#082F72; --board-line:#3567B5;
  --good:#1E7A44; --warn:#B4400A;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
/* Deliberately one light theme: white page, black text, blue highlights. */

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.01em;text-transform:uppercase;line-height:1.05}
h3{font-size:15px;font-weight:600}
p{margin:0}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
a{color:var(--sea)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:21px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{text-align:right;flex:none}
.clock .mono{font-size:20px;line-height:1}
.clock small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 10px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:500}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--sea)}
nav.tabs a[aria-current="page"] span{font-weight:600}

/* departure board */
.board{background:var(--board);color:#FFFFFF;border-radius:var(--r);padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.board .eyebrow{color:var(--board-dim)}
.board h1{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:.95;text-transform:uppercase;letter-spacing:.01em}
.board .sub{color:var(--board-dim);font-size:14px}
.flap{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.flap .cell{background:var(--cell);border-radius:6px;padding:6px 10px 4px;min-width:64px;text-align:center;position:relative}
.flap .cell::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--board);opacity:.8}
.flap .cell b{display:block;font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;color:var(--board-ink);font-variant-numeric:tabular-nums}
.flap .cell small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--board-dim);margin-top:2px}
.flap .lbl{font-size:14px;color:var(--board-dim);padding-bottom:8px;margin-left:4px}
.board-row{display:flex;flex-wrap:wrap;gap:8px 18px;border-top:1px solid var(--board-line);padding-top:12px}
.board-row div{display:flex;flex-direction:column;min-width:0}
.board-row small{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--board-dim)}
.board-row .mono{font-size:17px;color:#FFFFFF}
.alert{display:flex;gap:10px;align-items:flex-start;background:#FFFFFF;color:#000000;border-radius:8px;padding:10px 12px;font-size:13.5px}
.alert b{color:var(--board)}

/* day strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.strip button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;text-align:left;cursor:pointer;min-width:66px}
.strip button small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.strip button span{display:block;font-size:13px;font-weight:600;white-space:nowrap}
.strip button[aria-pressed="true"]{border-color:var(--sea);background:var(--sea-soft)}
.strip button.is-today small{color:var(--sea);font-weight:600}
.strip-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--sea);font-weight:600;cursor:pointer;font-size:13.5px}

/* sections */
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.grid2>*{min-width:0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.facts dt{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding-top:2px}
.facts dd{margin:0;min-width:0}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.plain li{display:flex;gap:10px;align-items:baseline}
ul.plain li .mark{flex:none;width:6px;height:6px;border-radius:50%;background:var(--sea);transform:translateY(-2px)}
.phr{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.phr span:nth-child(odd){font-weight:600}
.phr span:nth-child(even){color:var(--muted)}
.conv{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.conv input{width:90px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--sea-soft);color:var(--sea);white-space:nowrap}
.pill.ex{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.pill.sun{background:var(--sun);color:#FFFFFF}

/* agenda rows */
.agenda{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-family:var(--f-mono);font-size:14px;padding-top:1px}
.row .t small{display:block;color:var(--muted);font-size:11.5px}
.row .body{min-width:0}
.row .body b{font-weight:600;display:block}
.row .body span{font-size:14px;color:var(--muted)}
.row.next{background:linear-gradient(90deg,var(--sea-soft),transparent);margin:0 -16px;padding-left:16px;padding-right:16px}
.star{border:0;background:none;cursor:pointer;padding:4px;color:var(--muted)}
.star svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.star[aria-pressed="true"]{color:var(--sun)}
.star[aria-pressed="true"] svg{fill:currentColor}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:4px 6px}
.empty{padding:14px 0 4px;color:var(--muted);font-size:14px}

/* forms */
input[type=text],input[type=number],input[type=time],input[type=tel],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.form .wide{grid-column:1/-1}
.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer;background:var(--sea);color:var(--surface)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sun{background:var(--sun);color:#FFFFFF}
.btn:disabled{opacity:.55;cursor:default}
details.add>summary{cursor:pointer;color:var(--sea);font-weight:600;list-style:none;font-size:14px}
details.add>summary::-webkit-details-marker{display:none}
details.add[open]>summary{margin-bottom:10px}

/* checklist */
.check{display:flex;flex-direction:column;gap:2px}
.check label{display:flex;gap:10px;align-items:center;padding:6px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--sea);flex:none}

/* snap */
.snap{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.snap-cta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{font-size:13.5px;color:var(--muted)}
.status.err{color:var(--warn)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.catdot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;transform:translateY(-1px)}

/* voyage */
.mapbox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.mapbox svg{display:block;min-width:620px;width:100%;height:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat small{font-size:11.5px;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:58px 18px 1fr;gap:10px;align-items:start}
.tl .d{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);padding-top:12px;text-align:right}
.tl .d b{display:block;color:var(--ink);font-size:14px}
.tl .rail{position:relative;align-self:stretch}
.tl .rail::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.tl .rail i{position:absolute;left:3px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--sea)}
.tl li.sea .rail i{border-color:var(--line);background:var(--bg);width:8px;height:8px;left:5px;top:18px}
.tl li.past .rail i{background:var(--sea)}
.tl li.today .rail i{background:var(--sun);border-color:var(--sun);box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 30%,transparent)}
.tl .c{padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.tl .c b{font-weight:600}
.tl li.sea .c b{font-weight:500;color:var(--muted)}
.tl .c .mono{font-size:13px;color:var(--muted)}
.tl .clk{display:block;font-size:12.5px;color:var(--sun-ink);margin-top:2px}

/* spend */
.total{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.total b{font-family:var(--f-display);font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:5px;background:var(--sea-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sea);border-radius:5px}
.cats{display:flex;flex-direction:column;gap:8px}
.cats div{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center;font-size:13.5px}
.cats .bar{height:8px}
.cats .mono{text-align:right}

footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.pulse{animation:pulse 2.4s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(3)}}

/* host tools and shared content */
.host{border:1.5px dashed var(--sea);background:color-mix(in srgb,var(--sea-soft) 55%,var(--surface))}
.host .eyebrow{color:var(--sea)}
.notice{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sun);border-radius:var(--r);padding:12px 14px}
.notice p{flex:1;min-width:0;overflow-wrap:anywhere}
.notice small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.invite{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.invite .qr{background:#FFFFFF;border-radius:8px;padding:8px;width:150px;max-width:100%}
.invite .qr svg{display:block;width:100%;height:auto}
.invite .link{font-family:var(--f-mono);font-size:14px;overflow-wrap:anywhere}
@media (max-width:420px){.invite{grid-template-columns:1fr}.invite .qr{width:180px}}
.hero{display:flex;flex-direction:column;gap:10px;padding-block:6px 4px}
.hero .eyebrow{color:var(--sea)}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,12vw,60px);line-height:.9;text-transform:uppercase;letter-spacing:.01em;color:var(--board);margin:0}
.hero .route{font-size:15px;line-height:1.5;color:var(--ink);margin:0}
.hero .route i{font-style:normal;color:var(--sea);padding:0 4px}
.hero .route b{font-weight:600;white-space:nowrap}
.track{position:relative;height:26px;margin:4px 6px 0}
.track::before{content:"";position:absolute;left:0;right:0;top:11px;height:3px;border-radius:2px;background:var(--line)}
.track .done{position:absolute;left:0;top:11px;height:3px;border-radius:2px;background:var(--sea)}
.track .stop{position:absolute;top:6px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:var(--surface);border:2.5px solid var(--line)}
.track .stop.past{border-color:var(--sea);background:var(--sea)}
.track .stop.now{border-color:var(--sea);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--sea) 25%,transparent)}
.hero .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.hero .meta b{color:var(--ink);font-weight:600}
.ess .wx{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ess .wx b{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;color:var(--board)}
.ess .facts dd{overflow-wrap:anywhere}
.hours{display:grid;grid-template-columns:1fr auto;gap:6px 14px;margin:0}
.hours dt{min-width:0}
.hours dd{margin:0;font-family:var(--f-mono);font-size:14px;text-align:right;white-space:nowrap}
.hours dd.closed{color:var(--warn)}
details.box>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:"+";color:var(--sea);font-weight:600}
details.box[open]>summary::after{content:"−"}
details.box[open]>summary{margin-bottom:10px}
.pill.open{background:#E3F3EA;color:var(--good)}
.pill.warn{background:#FDEBDD;color:var(--warn)}
dl.decks{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
dl.decks dt{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--board);white-space:nowrap;line-height:1.3}
dl.decks dd{margin:0;min-width:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--board);color:#FFFFFF;border-radius:8px;padding:10px 14px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgb(0 0 0 / .25)}
</style>

  const toMs=J=>(J-2440587.5)*864e5;return {rise:toMs(Jt-w/360),set:toMs(Jt+w/360)};
}

/* ---------------- route geometry ---------------- */
function nm(a,b){const R=3440.065,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;const h=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const LEG_NM=LEGS.map(l=>l.slice(1).reduce((s,p,i)=>s+nm(l[i],p),0));
const TOTAL_NM=LEG_NM.reduce((a,b)=>a+b,0);
function alongLeg(leg,f){const L=LEGS[leg];let goal=LEG_NM[leg]*f;for(let i=1;i<L.length;i++){const s=nm(L[i-1],L[i]);if(goal<=s){const t=s?goal/s:0;return [L[i-1][0]+(L[i][0]-L[i-1][0])*t,L[i-1][1]+(L[i][1]-L[i-1][1])*t]}goal-=s}return L[L.length-1]}
function portTimes(pd){const p=PORTS[pd.port];return {arr:pd.arr?zoned(pd.date,pd.arr,p.tz):null,dep:pd.dep?zoned(pd.date,pd.dep,p.tz):null}}
/* Where is the ship at instant ms? */
function position(ms){
  for(let i=0;i<PORT_DAYS.length;i++){
    const pd=PORT_DAYS[i],t=portTimes(pd),p=PORTS[pd.port];
    const a=t.arr??-Infinity,d=t.dep??Infinity;
    if(ms>=a&&ms<d)return {inPort:pd,pos:[p.lat,p.lon],sailed:LEG_NM.slice(0,i).reduce((s,x)=>s+x,0),leg:i,frac:0};
    const nx=PORT_DAYS[i+1];
    if(nx&&ms>=d&&ms<portTimes(nx).arr){const f=(ms-d)/(portTimes(nx).arr-d);
      return {atSea:true,from:pd,to:nx,pos:alongLeg(i,f),leg:i,frac:f,sailed:LEG_NM.slice(0,i).reduce((s,x)=>s+x,0)+LEG_NM[i]*f,toGo:LEG_NM[i]*(1-f),eta:portTimes(nx).arr}}
  }
  if(ms<portTimes(PORT_DAYS[0]).dep)return {inPort:PORT_DAYS[0],pos:[PORTS.barcelona.lat,PORTS.barcelona.lon],sailed:0,leg:0,frac:0};
  return {inPort:PORT_DAYS[PORT_DAYS.length-1],pos:[PORTS.miami.lat,PORTS.miami.lon],sailed:TOTAL_NM,leg:LEGS.length,frac:0,done:true};
}

const SHIP_NUMBERS=[["Emergency","999"],["Medical Center","4400"],["Reception","00"]];
const toMin=s=>{const [h,m]=s.split(":").map(Number);return h*60+m};
/* Read an hours string such as "06:30–10:30", "15:00–close", "07:15–11:00 · 16:00–20:00", "24 hours", "Closed". */
function hourState(str,nowMin){
  if(/closed/i.test(str))return {state:"closed"};
  if(/24\s*hours/i.test(str))return {state:"open",until:"24 hours"};
  const ranges=[...String(str).matchAll(/(\d{1,2}:\d{2})\s*[–-]\s*(\d{1,2}:\d{2}|close|closing|late)/gi)].map(m=>({a:toMin(m[1]),b:/^\d/.test(m[2])?toMin(m[2]):24*60+120,bl:/^\d/.test(m[2])?m[2]:"late"}));
  if(!ranges.length)return {state:"unknown"};
  for(const r of ranges){if(nowMin>=r.a&&nowMin<r.b)return {state:"open",until:r.bl,soon:r.b-nowMin<=30}}
  const next=ranges.find(r=>r.a>nowMin);
  return next?{state:"later",from:String(Math.floor(next.a/60)).padStart(2,"0")+":"+String(next.a%60).padStart(2,"0")}:{state:"done"};
}
/* Most recent posted day (on or before date) that has opening hours. */
function hoursFor(date){
  const ds=Object.keys(SHARED.days||{}).filter(d=>d<=date&&SHARED.days[d].hours&&Object.keys(SHARED.days[d].hours).length).sort();
  return ds.length?{date:ds[ds.length-1],hours:SHARED.days[ds[ds.length-1]].hours}:null;
}
/* Venue → deck directory, gathered from every venue name with "(deck)" in the posted programs and hours. */
function deckDirectory(){
  const map=new Map();
  const add=s=>{for(const m of String(s||"").matchAll(/([A-ZÀ-Ý][\p{L}’'&.+\- ]*?)\s*\((\d{1,2})\)/gu)){
    let name=m[1].replace(/^(Breakfast|Lunch|Dinner|Coffee Corner|Pizzeria|Mexican lunch buffet|Breakfast buffet|Chef’s Market Dinner: Spain)\s*/i,"").replace(/\s+(Stbd|Port|Aft|Fwd)$/i," $1").trim();
    if(!name||name.length<3)continue;const k=name.toLowerCase()+"|"+m[2];if(!map.has(k))map.set(k,{name,deck:+m[2]})}};
  for(const d of Object.values(SHARED.programs||{}))for(const e of d.events||[])add(e.venue);
  for(const d of Object.values(SHARED.days||{})){for(const rows of Object.values(d.hours||{}))for(const [n] of rows)add(n);for(const t of d.tours||[])add(t.where)}
  const decks={};for(const v of map.values())(decks[v.deck]=decks[v.deck]||[]).push(v.name);
  return Object.entries(decks).sort((a,b)=>b[0]-a[0]).map(([deck,names])=>[deck,names.sort((a,b)=>a.localeCompare(b))]);
}

    const nextList=evs.filter(e=>{const a=toMin(e.time);return a>nowMin&&a<=nowMin+120}).slice(0,6);
    html+=`<div class="panel"><h3>Happening now</h3><div class="agenda">${nowList.length?eventRows(nowList,{star:true,date}):`<p class="empty">Nothing scheduled this minute.</p>`}</div></div>
    <div class="panel"><h3>Coming up in the next 2 hours</h3><div class="agenda">${nextList.length?eventRows(nextList,{star:true,date}):`<p class="empty">Nothing else in the next two hours. See the <a href="#program">full program</a>.</p>`}</div></div>`;
  }else{
    html+=`<div class="panel"><p class="empty">Today’s program hasn’t been posted yet. When it is, this shows what’s on right now.</p></div>`;
  }
  html+=`</section>`;
  // open now
  const H=hoursFor(date);
  if(H){
    const block=(title,rows)=>{if(!rows||!rows.length)return "";
      const st=rows.map(([n,v])=>({n,v,s:hourState(v,nowMin)}));
      const open=st.filter(x=>x.s.state==="open"),later=st.filter(x=>x.s.state==="later"),closed=st.filter(x=>x.s.state==="closed"||x.s.state==="done");
      return `<div class="panel sec"><h3>${title}</h3>
        ${open.length?`<dl class="hours">${open.map(x=>`<dt>${esc(x.n)}</dt><dd><span class="pill ${x.s.soon?"warn":"open"}">${x.s.until==="24 hours"?"24 hours":x.s.soon?"closes "+esc(x.s.until):"until "+esc(x.s.until)}</span></dd>`).join("")}</dl>`:`<p class="empty">Nothing open right now.</p>`}
        ${later.length?`<details class="box"><summary>Opening later (${later.length})</summary><dl class="hours">${later.map(x=>`<dt>${esc(x.n)}</dt><dd>from ${esc(x.s.from)}</dd>`).join("")}</dl></details>`:""}
        ${closed.length?`<details class="box"><summary>Closed now (${closed.length})</summary><dl class="hours">${closed.map(x=>`<dt>${esc(x.n)}</dt><dd class="closed">${esc(x.v)}</dd>`).join("")}</dl></details>`:""}
      </div>`};
    html+=`<section class="sec"><div class="sec-head"><h2>Open now</h2>${H.date!==date?`<span class="muted small">Hours from ${fmtDate(H.date)}</span>`:""}</div>
      ${H.date!==date?`<p class="small muted">Today’s hours aren’t posted yet, so these come from the last program. They can change day to day.</p>`:""}
      ${block("Food",H.hours.Restaurants)}${block("Bars & coffee",H.hours.Bars)}${block("Services & facilities",H.hours.Services)}</section>`;
  }
  // deck directory
  const dir=deckDirectory();
  if(dir.length)html+=`<section class="sec"><h2>Deck by deck</h2><div class="panel"><dl class="decks">${dir.map(([d,names])=>`<dt>Deck ${d}</dt><dd>${names.map(esc).join(" · ")}</dd>`).join("")}</dl></div>
    <p class="small muted">Built from the venues named in the daily programs, so it fills in as the voyage goes on.</p></section>`;
  // numbers
  html+=`<section class="sec"><h2>Ship phone numbers</h2><div class="panel"><dl class="hours">${SHIP_NUMBERS.map(([k,v])=>`<dt>${k}</dt><dd><b>${v}</b></dd>`).join("")}</dl><p class="small muted" style="margin-top:8px">Dial from any stateroom or ship phone.</p></div></section>`;
  return html;
}

/* ---------------- shell ---------------- */
const VIEWS={today:viewToday,voyage:viewVoyage,program:viewProgram,plans:viewPlans,onboard:viewOnboard};
function tab(){const h=location.hash.slice(1);return VIEWS[h]?h:"today"}
function render(){
  const tb=tab();
  document.getElementById("app").innerHTML=VIEWS[tb]()+`<footer>An independent guest-made companion for this voyage. Not affiliated with or endorsed by Oceania Cruises. Daily programs and notices are posted by a fellow guest from the printed copies. Your plans, stars and spending stay on this device. Itinerary from public listings and subject to change.</footer>`;
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.tab===tb?"page":"false"));
  updConv();tick();
  const mb=document.querySelector(".mapbox"),ship=mb&&mb.querySelector("circle.pulse");
  if(mb&&ship&&mb.scrollWidth>mb.clientWidth){const r=mb.scrollWidth/783;mb.scrollLeft=Math.max(0,+ship.getAttribute("cx")*r-mb.clientWidth/2)}
}
function tick(){
  const t=now(),off=shipOffset(t);
  document.getElementById("shipclock").textContent=shipParts(t).time;
  document.getElementById("shipclocklbl").textContent=(preview?"Preview · ":"Ship time · ")+offLabel(off);
  document.querySelectorAll("[data-cd]").forEach(el=>{const x=dur(+el.dataset.cd-t);const cells=el.querySelectorAll(".cell b");const vals=x.d?[x.d,pad(x.h),pad(x.m)]:[pad(x.h),pad(x.m)];cells.forEach((c,i)=>{if(vals[i]!==undefined)c.textContent=vals[i]})});
  document.querySelectorAll("[data-cdtext]").forEach(el=>el.textContent="in "+durText(+el.dataset.cdtext-t));
}
function updConv(){const a=document.getElementById("conv-amt"),r=document.getElementById("conv-rate"),o=document.getElementById("conv-out");if(a&&r&&o)o.textContent=fmtUSD(Math.round((+a.value||0)*(+r.value||0)*100)/100)}

document.addEventListener("click",e=>{
  const b=e.target.closest("button,[data-act]");if(!b)return;
  if(b.dataset.day){const real=shipParts(Date.now()).date;preview=b.dataset.day===real?null:b.dataset.day;render();return}
  const act=b.dataset.act;
  if(act==="live"){preview=null;render()}
  if(act==="stop"&&busy){busy.abort()}
  if(act==="copylink"){const txt=SHARED.link;const done=()=>toast("Link copied.");try{navigator.clipboard.writeText(txt).then(done,()=>{selectText("sharelink")})}catch(_){selectText("sharelink")}}
  if(act==="discard-draft"){draft=null;saveDraft();render()}
  if(act==="publish-draft"&&draft){const d=draft;pushShared(n=>{n.programs[d.date]={events:d.events,at:Date.now()};if(d.day)n.days[d.date]=d.day;if(d.allAboard&&dayOf(d.date)&&dayOf(d.date).port)n.allAboard[d.date]=d.allAboard},`Publishing the program for ${fmtDate(d.date)}`)}
  if(act==="unpublish"){const date=progDate||curDay().date;pushShared(n=>{delete n.programs[date];delete n.days[date]},"Removing the program")}
  if(b.dataset.deldraft&&draft){draft.events=draft.events.filter(x=>x.id!==b.dataset.deldraft);saveDraft();render()}
  if(b.dataset.delnote){const id=b.dataset.delnote;pushShared(n=>{n.notices=n.notices.filter(x=>x.id!==id)},"Removing the notice")}
  if(act==="clearex-plans"){S.plans=S.plans.filter(p=>!p.ex);save();render()}
  if(act==="clearex-spend"){S.spend.items=S.spend.items.filter(p=>!p.ex);save();render()}
  if(b.dataset.star){
    const date=progDate||curDay().date,id=b.dataset.star;
    const existing=S.plans.find(p=>p.ev===id&&p.date===date);
    if(existing)S.plans=S.plans.filter(p=>p!==existing);
    else{const pr=programFor(date);const ev=pr.events.find(x=>x.id===id);if(ev)S.plans.push({id:uid(),date,time:ev.time,title:ev.title,type:"Program",where:ev.venue||"",ev:id,ex:pr.kind==="example"})}
    save();render();
  }
  if(b.dataset.delplan){S.plans=S.plans.filter(p=>p.id!==b.dataset.delplan);save();render()}
  if(b.dataset.delspend){S.spend.items=S.spend.items.filter(p=>p.id!==b.dataset.delspend);save();render()}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.ck){const d=curDay().date;S.check[d]=S.check[d]||{};S.check[d][el.dataset.ck]=el.checked;save()}
  if(el.id==="agent"){S.agent[curDay().date]=el.value;save()}
  if(el.id==="progdate"){progDate=el.value;render()}
  if(el.id==="obc"){S.spend.obc=Math.max(0,+el.value||0);save();render()}
  if(el.id==="conv-rate"){const p=PORTS[curDay().port];if(p)S.rates[p.cur]=+el.value||0;save()}
  if((el.id==="snapfile"||el.id==="pickfile")&&el.files&&el.files.length&&sampleFn)readPhotos(Array.from(el.files));
});
document.addEventListener("input",e=>{if(e.target.id==="conv-amt"||e.target.id==="conv-rate")updConv()});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target,v=id=>document.getElementById(id).value.trim();
  if(f.id==="planform"){if(!v("pl-title"))return;S.plans.push({id:uid(),date:v("pl-date"),time:v("pl-time"),title:v("pl-title"),type:v("pl-type"),where:v("pl-where")});save();render()}
  if(f.id==="spendform"){const a=parseFloat(v("sp-amt"));if(!(a>=0))return;S.spend.items.push({id:uid(),date:v("sp-date"),amount:a,cat:v("sp-cat"),note:v("sp-note")});save();render()}
  if(f.id==="evform"&&isHost){const date=progDate||curDay().date;if(!v("ev-title"))return;
    if(!draft||draft.date!==date)draft={date,events:SHARED.programs[date]?JSON.parse(JSON.stringify(SHARED.programs[date].events)):[],allAboard:null,created:Date.now()};
    draft.events.push({id:uid(),time:v("ev-time"),end:null,title:v("ev-title"),venue:v("ev-venue")||null,cat:v("ev-cat")});draft.events.sort((a,b)=>a.time.localeCompare(b.time));draft.created=Date.now();saveDraft();render()}
  if(f.id==="noteform"&&isHost){const txt=v("note-in").slice(0,240);if(!txt)return;const sp=shipParts(Date.now());pushShared(n=>{n.notices.push({id:uid(),text:txt,date:sp.date,time:sp.time,at:Date.now()});n.notices=n.notices.slice(-12)},"Posting the notice")}
  if(f.id==="aaform"&&isHost){const date=curDay().date,val=v("aa-in");pushShared(n=>{if(val)n.allAboard[date]=val;else delete n.allAboard[date]},"Publishing the all-aboard time")}
  if(f.id==="linkform"&&isHost){const val=v("link-in");if(val&&!/^https?:\/\//i.test(val)){toast("Links need to start with https://");return}pushShared(n=>{n.link=val},"Publishing the link")}
});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
setInterval(()=>{const a=document.activeElement;if(tab()==="today"&&!preview&&curDay().date!==(window.__lastDay)){window.__lastDay=curDay().date;if(!a||!/INPUT|SELECT|TEXTAREA/.test(a.tagName))render()}else tick()},20000);
window.__lastDay=curDay().date;
render();

function selectText(id){const el=document.getElementById(id);if(!el)return;const r=document.createRange();r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast("Link selected. Copy it from the menu.")}

/* On the public website (not inside Claude), keep a copy for offline use on patchy ship Wi-Fi. */
if(!window.claude&&"serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
/* Who is viewing: the page's owner gets host tools; everyone else gets the read-only guest view. */
(async()=>{
  const c=window.claude;
  const [u,a,s]=c?await Promise.all(["user","artifact","sample"].map(n=>c.use(n).catch(()=>null))):[null,null,null];
  try{isHost=!!(u&&a&&await u.canEdit())}catch(e){isHost=false}
  artifactNS=isHost?a:null;
  if(isHost&&s){const lim=await s.limits().catch(()=>null);sampleFn=s;canImages=!!(lim&&lim.images);if(!canImages)sampleFn=false}else sampleFn=false;
  const el=document.activeElement;if(!el||!/INPUT|SELECT|TEXTAREA/.test(el.tagName))render();
})();
</script>
